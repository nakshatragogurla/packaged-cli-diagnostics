[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-health"
version = "1.0.0"
description = "A CLI tool for diagnosing developer environments"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
dev-health = "dev_health.cli:main"

[tool.setuptools.packages.find]
where = ["src"]